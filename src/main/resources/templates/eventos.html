<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Organizar Evento - Polimorfismo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f4; }
        h1 { color: #2c3e50; }
        table { border-collapse: collapse; width: 100%; background-color: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .tipo { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

<h1>Trabajo 1 - Organizar Evento (Polimorfismo)</h1>
<p>9 objetos de tipo Boda, Concierto y Conferencia, invocados de forma polimórfica a través de la interfaz <code>OrganizadorEvento</code>.</p>

<table>
    <thead>
    <tr>
        <th>Tipo</th>
        <th>planificar()</th>
        <th>ejecutar()</th>
        <th>cerrar()</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="resultado : ${resultados}">
        <td class="tipo" th:text="${resultado.tipo()}">Tipo</td>
        <td th:text="${resultado.planificar()}">planificar</td>
        <td th:text="${resultado.ejecutar()}">ejecutar</td>
        <td th:text="${resultado.cerrar()}">cerrar</td>
    </tr>
    </tbody>
</table>

</body>
</html>
